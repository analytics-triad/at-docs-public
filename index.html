<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AT Docs</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #24292e; line-height: 1.5; }
    h1 { border-bottom: 2px solid #eaecef; padding-bottom: 10px; }
    details { margin-bottom: 16px; border: 1px solid #d0d7de; border-radius: 6px; padding: 10px 14px; background: #fff; }
    summary { font-weight: 600; cursor: pointer; color: #0969da; font-size: 1.1em; outline: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #hsla(210,18%,87%,1); font-size: 14px; }
    th { color: #57606a; background-color: #f6f8fa; }
    .date { color: #57606a; font-size: 13px; white-space: nowrap; }
    .actions { white-space: nowrap; text-align: right; }
    .btn { background-color: #f6f8fa; border: 1px solid rgba(27,31,36,0.15); padding: 5px 12px; border-radius: 6px; text-decoration: none; color: #24292e; font-size: 12px; font-weight: 500; margin-left: 6px; display: inline-block; }
    .btn:hover { background-color: #f3f4f6; border-color: rgba(27,31,36,0.25); }
    .btn-download { color: #0969da; }
    .loading { font-style: italic; color: #57606a; }
  </style>
</head>
<body>

  <h1>Analytics Triad - Documentation Portal</h1>
  <div id="explorer" class="loading">Loading directory tree...</div>

  <script>
    // Config: Update these to match your GitHub details
    const ORG = 'analytics-triad';
    const REPO = 'at-docs-public';
    const BRANCH = 'main';

    async function initExplorer() {
      const explorer = document.getElementById('explorer');
      try {
        // Fetch full tree from GitHub API
        const treeRes = await fetch(`https://api.github.com/repos/${ORG}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        const treeData = await treeRes.json();

        if (!treeData.tree) throw new Error("Could not fetch file tree.");

        // Group .md files by their top-level folder
        const folders = {};
        const mdFiles = treeData.tree.filter(item => item.type === 'blob' && item.path.endsWith('.md') && item.path !== 'README.md');

        for (const file of mdFiles) {
          const pathParts = file.path.split('/');
          const folderName = pathParts.length > 1 ? pathParts[0] : 'General';
          const fileName = pathParts.slice(1).join('/') || file.path;

          if (!folders[folderName]) folders[folderName] = [];
          folders[folderName].push({ path: file.path, name: fileName });
        }

        explorer.innerHTML = '';
        explorer.classList.remove('loading');

        // Render each folder section
        for (const [folder, files] of Object.entries(folders)) {
          const details = document.createElement('details');
          details.open = true; // Set to false if you want them collapsed by default
          
          let tableRows = '';
          for (const file of files) {
            // Encode the path to properly handle spaces or special characters in URLs
            const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
            const rawUrl = `https://raw.githubusercontent.com/${ORG}/${REPO}/${BRANCH}/${encodedPath}`;
            const viewUrl = `https://github.com/${ORG}/${REPO}/blob/${BRANCH}/${encodedPath}`;

            tableRows += `
              <tr>
                <td>📄 <strong>${file.name}</strong></td>
                <td class="date" id="date-${file.path.replace(/[^a-zA-Z0-9]/g, '-')}">Loading date...</td>
                <td class="actions">
                  <a class="btn" href="${viewUrl}" target="_blank">View</a>
                  <a class="btn btn-download" href="${rawUrl}" download="${file.name}">Download</a>
                </td>
              </tr>
            `;
          }

          details.innerHTML = `
            <summary>📂 ${folder}</summary>
            <table>
              <thead>
                <tr>
                  <th>Document Name</th>
                  <th>Last Updated</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          `;
          explorer.appendChild(details);

          // Asynchronously fetch last commit dates for files in this folder
          files.forEach(file => fetchLastCommitDate(file.path));
        }
      } catch (err) {
        explorer.innerHTML = `<p style="color:red;">Failed to load file list. Make sure the repository is public.</p>`;
      }
    }

    async function fetchLastCommitDate(filePath) {
      try {
        const encodedFilePath = encodeURIComponent(filePath);
        const res = await fetch(`https://api.github.com/repos/${ORG}/${REPO}/commits?path=${encodedFilePath}&page=1&per_page=1`);
        const commits = await res.json();
        const elementId = `date-${filePath.replace(/[^a-zA-Z0-9]/g, '-')}`;
        const targetTd = document.getElementById(elementId);
        
        if (commits && commits.length > 0) {
          const rawDate = new Date(commits[0].commit.committer.date);
          targetTd.textContent = rawDate.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        } else {
          targetTd.textContent = 'N/A';
        }
      } catch (e) {
        // Silently fail if rate-limited for dates
      }
    }

    initExplorer();
  </script>
</body>
</html>
